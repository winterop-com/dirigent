name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: build and deploy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync the workspace
        run: uv sync --all-packages --locked

      # --strict fails the build on any warning, including a broken internal link.
      - name: Build the site
        run: uv run mkdocs build --strict

      # The basics tutorial is published as a page and as paper. Chromium prints the built
      # page, so the PDF lands inside site/ and ships with it.
      - name: Install Chromium
        run: uv run --with playwright==1.64.1 playwright install --with-deps chromium

      - name: Print the basics tutorial to PDF
        run: uv run --with playwright==1.64.1 python scripts/docs_pdf.py --skip-build

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
