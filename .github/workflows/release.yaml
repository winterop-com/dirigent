name: release

# A `v*` tag publishes: every package to PyPI, and the image to GHCR.
#
# PyPI auth is trusted publishing, so no token is stored here: PyPI verifies the OIDC token
# GitHub mints for this workflow file and environment. The image is held behind the `ghcr`
# environment, and only after the tag has been checked against every package's version.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build the distributions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      # Every package in the workspace carries the tag's version, so a mismatch is a bump
      # that did not land and a release that would publish the previous one.
      - name: Check the tag matches the version every package carries
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for package in packages/*/pyproject.toml; do
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' "$package" | head -1)
            if [ "$version" != "$tag" ]; then
              echo "$package carries $version, tag says $tag"
              exit 1
            fi
          done

      # The server wheel packages src/dirigent_server/static/, so the bundle is built and
      # put there before the build.
      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Build the bundle into the server package
        run: make ui-static

      # One dist directory per package, so the publish job for a package uploads its own
      # files and nothing else.
      - name: Build every wheel and sdist
        run: |
          for package in packages/*/; do
            name=$(basename "$package")
            uv build --package "$name" --out-dir "dist/$name"
          done

      - name: Refuse a server wheel without the UI
        run: unzip -l dist/dirigent-server/dirigent_server-*.whl | grep -q 'dirigent_server/static/index.html'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  pypi:
    name: publish ${{ matrix.package }} to PyPI
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package:
          - dirigent-common
          - dirigent-plugin
          - dirigent-client
          - dirigent-core
          - dirigent-block-base
          - dirigent-block-duckdb
          - dirigent-block-execute
          - dirigent-block-http
          - dirigent-block-jq
          - dirigent-block-parquet
          - dirigent-block-queues
          - dirigent-block-sql
          - dirigent-block-storage
          - dirigent-blocks
          - dirigent-examples
          - dirigent-server
          - dirigent-cli
          - dirigent-mcp
          - dirigent-storage-s3
          - dirigent-testing
    # One environment per package: PyPI's trusted publisher for a project is the tuple of
    # repository, workflow and environment, and every package needs its own.
    environment:
      name: pypi-${{ matrix.package }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      # No password: the action exchanges the runner's OIDC token with PyPI. A file PyPI
      # already holds is skipped, so a rerun after a partial upload publishes the rest.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/${{ matrix.package }}/
          skip-existing: true

  # A job that calls a reusable workflow cannot name an environment, so the gate is a job of
  # its own and the image waits on it. The environment holds only what its protection rules
  # say: with no required reviewers on `ghcr`, this passes without stopping.
  approve-image:
    name: approve publishing the image
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: ghcr
    permissions: {}
    steps:
      - name: Name what is being published
        run: echo "Publishing $GITHUB_REF_NAME to ghcr.io/winterop-com/dirigent"

  # Both platforms, on docker's reusable builder: it sets up QEMU and buildx, tags from the
  # git tag through metadata-action, and pushes one multi-platform manifest.
  image:
    name: publish the image
    needs: approve-image
    uses: docker/github-builder/.github/workflows/build.yml@cbc9d42f8c89a55623392aadd03600965b80e963 # v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      file: infra/Dockerfile
      meta-images: ghcr.io/winterop-com/dirigent
      meta-tags: |
        type=semver,pattern={{version}}
        type=raw,value=latest
      # The version, revision and source labels come from metadata-action off the git tag,
      # and a label given to the build wins over the Dockerfile's.
      set-meta-labels: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
