# A three-step chain, and how one step reads another's output.
#
# depends_on draws the edge; ${steps.<name>.output.<field>} reads across it. A step may
# only read from a step it depends on, transitively, and apply checks that: the reference
# language has no way to reach sideways into an unrelated branch.
#
# http.request writes its response body to the run's scratch space with save_to, so the
# copy step has a real object to move.
#
# report uses shell.run, which executes code on the worker and is refused unless the
# instance allowlists it:
#   export DIRIGENT_ENABLED_UNSAFE_BLOCKS='["shell.run"]'
#   dg run --local examples/graph/linear.yaml -p day=2026-01-01
# or, without touching the environment:
#   dg run --local examples/graph/linear.yaml -p day=2026-01-01 --enable-unsafe shell.run

format: dirigent/v1
kind: pipeline
code: linear
name: A straight line of steps
description: Fetch a payload, archive what came back, then report what was archived.

tags: [graph, execute, http, storage]

params:
  type: object
  required: [day]
  properties:
    day:
      type: string
      format: date

steps:
  fetch:
    block: http.request
    config:
      url: https://postman-echo.com/get
      method: GET
      query:
        day: "${params.day}"
      # The body goes to storage rather than into the step's output: a response of any
      # size is then a URI the next step reads, and the run record stays small.
      save_to: "${run.scratch}/incoming/${params.day}.json"

  archive:
    block: storage.copy
    # depends_on is what orders the run; nothing infers an edge from one step reading
    # another's output, so the dependency is stated even though the reference implies it.
    depends_on: [fetch]
    config:
      source: "${steps.fetch.output.body_uri}"
      target: "${run.scratch}/archive/${params.day}.json"

  report:
    block: shell.run
    depends_on: [archive]
    config:
      argv:
        - echo
        - "service ${steps.fetch.output.status}, archived ${steps.archive.output.bytes_copied} bytes"
