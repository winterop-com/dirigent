# Ask for a run's report and write no template at all.
#
# In:  five sales rows, inline.
# Out: a total per region, and the run's own report document -- the built-in one, because
#      the report: section is empty.
#
# `report: {}` is the whole of the opt-in. A document with no report: section renders
# nothing; an empty section renders the page the engine ships:
#
#   a title    the pipeline's name, or its code when it has none, and the run's status
#   the facts  run id, pipeline and version, trigger, started, finished, duration, and the
#              data window when the run has one
#   the steps  a row per step: outcome, attempts, how long it took, how many warnings it
#              logged, which a succeeded step can still have
#   the items  the elements that failed, when a fan-out step had any, each with the step it
#              failed at and the error
#   the error  the run's own error, or a cancellation's reason, when it ended badly
#
# That page is written by the engine rather than by a step, which is the point of it: a run
# that was cancelled, or whose worker died, has no step left to write anything, and those
# are the runs whose account is worth the most. It is rendered in the transaction that
# settles the run, and rewritten in place if a retry reopens the run and it settles again.
#
# The two steps are here to give the page something to tabulate, and they are the smallest
# pair that does: a literal, and one jq program over it.
#
# To change it: write a `template:` under report: and the page is yours instead --
# http-post-report.yaml is that document, and docs/reports.md lists every fact a template
# may read.
#
#   dg run --local examples/recipes/report-built-in.yaml
#   dg apply examples/recipes/report-built-in.yaml
#   dg run report-built-in --watch
#   dg runs report RUN_ID --markdown

format: dirigent/v1
kind: pipeline
code: report-built-in
name: The built-in report
description: The smallest pipeline that renders a report document, with an empty report section and no template of its own.

tags: [recipes, transform, report]

requires:
  blocks:
    - value.const
    - transform.jq

steps:
  rows:
    block: value.const
    config:
      value:
        - { region: east, revenue: 300 }
        - { region: east, revenue: 250 }
        - { region: west, revenue: 100 }
        - { region: west, revenue: 100 }
        - { region: north, revenue: 200 }

  totals:
    block: transform.jq
    depends_on: [rows]
    config:
      input: ${steps.rows.output.value}
      program: |
        {regions: (group_by(.region)
                   | map({region: .[0].region,
                          rows: length,
                          revenue: (map(.revenue) | add)})),
         revenue: (map(.revenue) | add)}

report: {}
