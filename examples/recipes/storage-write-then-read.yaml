# Hand work from one step to the next through storage, which is how a big payload travels.
#
# In:  a list built inline.
# Out: two files in the run's scratch space and a summary read back out of the second one.
#
# A value flows through step outputs. storage.write is the only way one goes out and
# storage.read the only way one comes back in, so a chain that wants to hand work along
# through storage is written as that pair, twice:
#
#   storage.write   target, and exactly one of text or value. Output: uri, bytes_written,
#                   content_type. A value is written as canonical JSON -- sorted keys, no
#                   spaces -- so the same value writes the same bytes every run.
#   storage.read    source, and max_size: how much of the object this step will hold, 1mb
#                   unless it says otherwise. An object above the cap is refused rather than
#                   truncated, because half a document is not a smaller one, it is a wrong
#                   one. The object comes back as `value` when it is JSON and as `text`
#                   otherwise, and a type it cannot decode it refuses instead of guessing.
#
# ${run.scratch} is the run's own prefix in whatever storage the instance is configured
# with. On a --local run that is a directory under a temporary tree that is deleted when the
# run ends; on a server it is the artifact root, and with an s3 connection configured for
# the scheme it is a bucket. The document says none of that: it names a scheme-agnostic
# prefix, and where the bytes land is an instance setting.
#
# Every read below is spelled ${steps.<step>.output.uri} rather than the same path typed
# twice: one place decides where a file went, and a rename is a one-line change.
#
# To change it: point the targets at s3://<bucket>/... and nothing else in the document
# moves.
#
#   dg run --local examples/recipes/storage-write-then-read.yaml
#   dg run --local examples/recipes/storage-write-then-read.yaml -p day=2026-02-01

format: dirigent/v1
kind: pipeline
code: storage-write-then-read
name: Write to storage, then read it back
description: Put a transform's result in the run's scratch space with storage.write, read it into the next step with storage.read, and do it again with what that step produced.

tags: [recipes, storage, transform]

requires:
  blocks:
    - transform.jq
    - storage.write
    - storage.read

params:
  type: object
  properties:
    day:
      type: string
      format: date
      default: "2026-01-01"
      description: The day the written files are named for.
    stations:
      type: integer
      minimum: 1
      default: 50
      description: How many rows are generated.

steps:
  generate:
    block: transform.jq
    config:
      input:
        count: ${params.stations}
        day: ${params.day}
      program: |
        . as {$count, $day}
        | [range($count)
           | {station: "st-\(.)", day: $day,
              celsius: (. % 17) - 5,
              active: (. % 5 != 0)}]

  save:
    block: storage.write
    depends_on: [generate]
    config:
      target: ${run.scratch}/readings-${params.day}.json
      value: ${steps.generate.output.value}

  back:
    block: storage.read
    depends_on: [save]
    config:
      # Where the write said the object landed, not the same path typed twice.
      source: ${steps.save.output.uri}
      max_size: 8mb

  cold:
    block: transform.jq
    depends_on: [back]
    config:
      # The rows as they came off storage, not as they were held in memory upstream.
      input: ${steps.back.output.value}
      program: |
        [.[] | select(.celsius < 0)]

  save_cold:
    block: storage.write
    depends_on: [cold]
    config:
      target: ${run.scratch}/cold-${params.day}.json
      value: ${steps.cold.output.value}

  back_cold:
    block: storage.read
    depends_on: [save_cold]
    config:
      source: ${steps.save_cold.output.uri}

  summary:
    block: transform.jq
    depends_on: [back_cold]
    config:
      input: ${steps.back_cold.output.value}
      program: |
        {cold_rows: length, coldest: (min_by(.celsius) | .station)}
