# Write a result to storage and read it back in the next step, which is how a big payload
# travels between steps.
#
# In:  a list built inline.
# Out: two files in the run's scratch space and a summary read back out of the second one.
#
# Every transform takes save_to and every transform takes input_uri, so a chain of them can
# hand work along through storage instead of through step outputs. The mechanism is worth
# seeing once because nothing in the document announces it except those two fields:
#
#   save_to      the result is streamed to that URI and the step's output changes shape.
#                There is no `value` any more: the output carries output_uri and
#                output_bytes, and a downstream step that reads .value gets null.
#   input_uri    the input is streamed from a URI rather than written inline. max_input
#                bounds what is read into memory -- 32mb by default -- and an input larger
#                than the bound is refused rather than truncated, because half a document
#                is not a smaller input, it is a wrong one.
#
# ${run.scratch} is the run's own prefix in whatever storage the instance is configured
# with. On a --local run that is a directory under a temporary tree that is deleted when the
# run ends; on a server it is the artifact root, and with an s3 connection configured for
# the scheme it is a bucket. The document says none of that: it names a scheme-agnostic
# prefix, and where the bytes land is an instance setting.
#
# The second write is the reason the read is spelled ${steps.<step>.output.output_uri}
# rather than the same path typed twice: one place decides where a file went, and a rename
# is a one-line change.
#
# To change it: point save_to at s3://<bucket>/... and nothing else in the document moves.
#
#   dg run --local examples/recipes/storage-write-then-read.yaml
#   dg run --local examples/recipes/storage-write-then-read.yaml -p day=2026-02-01

format: dirigent/v1
kind: pipeline
code: storage-write-then-read
name: Write to storage, then read it back
description: Stream a transform's result to the run's scratch space with save_to, then read it in the next step with input_uri.

tags: [recipes, storage, transform]

requires:
  blocks:
    - transform.jq

params:
  type: object
  properties:
    day:
      type: string
      format: date
      default: "2026-01-01"
      description: The day the written files are named for.
    stations:
      type: integer
      minimum: 1
      default: 50
      description: How many rows are generated.

steps:
  generate:
    block: transform.jq
    config:
      input:
        count: ${params.stations}
        day: ${params.day}
      program: |
        . as {$count, $day}
        | [range($count)
           | {station: "st-\(.)", day: $day,
              celsius: (. % 17) - 5,
              active: (. % 5 != 0)}]
      # The output is a file rather than a value: this step's output carries no `value`.
      save_to: ${run.scratch}/readings-${params.day}.json

  cold:
    block: transform.jq
    depends_on: [generate]
    config:
      # Streamed in from where the write said it landed, not from a path written twice.
      input_uri: ${steps.generate.output.output_uri}
      max_input: 8mb
      program: |
        [.[] | select(.celsius < 0)]
      save_to: ${run.scratch}/cold-${params.day}.json

  summary:
    block: transform.jq
    depends_on: [generate, cold]
    config:
      input_uri: ${steps.cold.output.output_uri}
      program: |
        {cold_rows: length, coldest: (min_by(.celsius) | .station)}
