# A csv report, written where a person can fetch it.
#
# The chain that turns records into a file: a fixed value stands in for whatever produced
# the records, a jq program shapes them into flat rows, and convert.std writes the rows as
# csv into the run's scratch -- so the run's Output tab lists a report.csv somebody can
# read back. Nothing here is on the allowlist.
#
# The rows must be flat: a nested value has no csv spelling and is refused naming the row
# and the key, so the jq step is where a list becomes one joined cell.
#
#   dg run --local examples/transform/csv-report.yaml --keep

format: dirigent/v1
kind: pipeline
code: csv-report
name: A report as csv
description: Shape records into flat rows, write them as a csv artifact.

tags: [transform, storage]

steps:
  readings:
    block: value.const
    config:
      value:
        - { station: st-1, region: east, celsius: 4.5, tags: [ok, new] }
        - { station: st-3, region: west, celsius: 1.2, tags: [ok] }
        - { station: st-4, region: north, celsius: -3.4, tags: [] }
  rows:
    block: transform.jq
    depends_on: [readings]
    config:
      input: ${steps.readings.output.value}
      # Flatten for the codec: the tag list becomes one joined cell, because only this
      # program knows what the separator should mean. tojson because a codec takes text.
      program: |
        [.[] | {station, region, celsius, tags: (.tags | join(" "))}] | tojson
  report:
    block: convert.std
    depends_on: [rows]
    config:
      input: "${steps.rows.output.value}"
      from: json
      to: csv
      save_to: ${run.scratch}/report.csv
