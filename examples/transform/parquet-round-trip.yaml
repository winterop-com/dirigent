# Records into parquet and back, where the types survive the trip.
#
# Parquet is the typed spelling at rest: where csv turns every value into a string, a
# parquet column knows it holds an integer or a float, and convert.arrow infers that
# schema from the records as it writes. This writes a batch to a parquet file, reads it
# back, and the numbers come back numbers rather than strings.
#
# Parquet is bytes, so it always travels by uri -- input_uri in, save_to out -- which is
# why the write lands in the run's scratch and the read names that same file. convert.arrow
# ships in the dirigent-parquet pack; installing it is what puts the block in the catalog.
#
#   dg run --local examples/transform/parquet-round-trip.yaml --keep

format: dirigent/v1
kind: pipeline
code: parquet-round-trip
name: A parquet round trip
description: Write records to a parquet file, then read them back with their types intact.

tags: [transform, storage]

requires:
  blocks:
    - value.const
    - transform.jq
    - convert.arrow

steps:
  readings:
    block: value.const
    config:
      value:
        - { station: st-1, region: east, celsius: 4.5, active: true }
        - { station: st-3, region: west, celsius: 1.2, active: true }
        - { station: st-4, region: north, celsius: -3.4, active: false }
  as_text:
    block: transform.jq
    depends_on: [readings]
    config:
      input: ${steps.readings.output.value}
      # tojson because a codec takes text: the records leave here as one JSON string.
      program: tojson
  write:
    block: convert.arrow
    depends_on: [as_text]
    config:
      input: "${steps.as_text.output.value}"
      from: json
      to: parquet
      # Parquet cannot inline -- it is bytes -- so the target is a uri.
      save_to: ${run.scratch}/readings.parquet
  read_back:
    block: convert.arrow
    depends_on: [write]
    config:
      input_uri: ${steps.write.output.output_uri}
      from: parquet
      to: json
