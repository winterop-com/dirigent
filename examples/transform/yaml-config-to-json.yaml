# A YAML document is one value, so a config file converts to the object it describes.
#
# This is the half of convert.std that is not the sequence of records: yaml and json trade
# one whole value in either direction, so a settings file becomes a JSON object a jq program
# can read, and a JSON value becomes a YAML document again. The stream spelling -- one `---`
# document per ndjson line -- is the other half, and examples/transform/ndjson-round-trip.yaml
# is where the sequence side lives.
#
# The one thing to know before pointing this at a real file: YAML says things JSON cannot.
# An unquoted 2026-03-01 is a date, not a string, and the codec refuses it naming its path
# rather than guessing what text it meant. That is why the retention date below is quoted.
#
#   dg run --local examples/transform/yaml-config-to-json.yaml

format: dirigent/v1
kind: pipeline
code: yaml-config-to-json
name: A config as an object
description: |
  Read a YAML config as the JSON object it describes, take what a run needs out of it,
  and write the answer back as YAML.

  `convert.std` reads `yaml` two ways. This document uses the first:

  1. one **document** is one value, traded with `json`
  2. one **stream** of documents is one line each, traded with `ndjson`

tags: [transform]

requires:
  blocks:
    - convert.std
    - transform.jq

steps:
  settings:
    block: convert.std
    config:
      # Written inline so the example needs no network. In a real pipeline this is
      # input_uri, pointing at the config a git.checkout or an http.request put in storage.
      input: |
        name: daily-load
        schedule: 0 3 * * *
        # Quoted, because an unquoted date is a YAML date and JSON has no date: the codec
        # refuses it at $.retention.before rather than deciding what text it meant.
        retention:
          before: "2026-03-01"
        targets:
          - code: warehouse
            enabled: true
          - code: archive
            enabled: false
      from: yaml
      to: json

  enabled:
    block: transform.jq
    depends_on: [settings]
    config:
      # A codec's output is text, so the program parses it first. What comes back is the
      # config as an object: keys are keys, and true is a boolean rather than the word.
      input: "${steps.settings.output.text}"
      program: |
        fromjson
        | {name, schedule, before: .retention.before,
           targets: [.targets[] | select(.enabled) | .code]}
        | tojson

  as_yaml:
    block: convert.std
    depends_on: [enabled]
    config:
      # Back the way it came: one JSON value, one YAML document, keys in the order the
      # program built them.
      input: "${steps.enabled.output.value}"
      from: json
      to: yaml
