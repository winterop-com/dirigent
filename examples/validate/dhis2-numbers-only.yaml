# Narrow a DHIS2 read with a filter, then sharpen the result with an instance schema.
#
# The filter query parameter narrows what DHIS2 returns -- valueType:eq:NUMBER asks the server
# for the NUMBER-valued data elements alone. The dhis2-number-data-elements schema the instance
# holds then sharpens: it pins valueType to exactly NUMBER, so if the filter is ever dropped or
# ignored, a non-NUMBER element fails the gate rather than slipping through. The narrow is an
# optimisation; the sharpen is the guarantee.
#
#   dg run --local --schema examples/schemas/dhis2-number-data-elements.json \
#     examples/validate/dhis2-numbers-only.yaml

format: dirigent/v1
kind: pipeline
code: dhis2-numbers-only
name: Data elements, NUMBER only
description: Fetch only NUMBER-valued data elements with a DHIS2 filter, and prove none slipped through with a schema.

tags: [validate, http]

requires:
  blocks:
    - http.request
    - validate.schema
  schemas:
    - dhis2-number-data-elements

connections:
  dhis2-demo:
    kind: http
    config:
      base_url: https://play.im.dhis2.org/stable-2-43-1
      basic_username: admin
      basic_password: district
      timeout: 1m

steps:
  fetch:
    block: http.request
    config:
      connection: dhis2-demo
      path: /api/dataElements.json
      method: GET
      query:
        fields: id,name,valueType
        filter: valueType:eq:NUMBER
        paging: false
  check:
    block: validate.schema
    depends_on: [fetch]
    config:
      input: ${steps.fetch.output.json_body}
      schema: dhis2-number-data-elements
