# A PostgreSQL warehouse for the sql examples to read, beside the stack's own database.
# `make docker-run-sql` includes it.
#
# The stack's `postgres` is dirigent's own database -- runs, attempts, connections, secrets --
# and never a warehouse. A pipeline reads `warehouse`, which is a second server with its own
# roles, so a document reaches the data without reaching the instance that runs it.
#
# Create the two connections once, by service name -- the address the server and worker
# containers resolve, not the one your shell does:
#
#   dg connection create sql warehouse-read \
#     --set url=postgresql+asyncpg://reader@warehouse:5432/warehouse \
#     --set password=$WAREHOUSE_READER_PASSWORD \
#     --set read_only=true
#   dg connection create sql warehouse-write \
#     --set url=postgresql+asyncpg://writer@warehouse:5432/warehouse \
#     --set password=$WAREHOUSE_WRITER_PASSWORD
#
# `reader` holds SELECT and nothing else, so read_only on the connection is the database's
# answer as well as the connection's. examples/sql/warehouse.sql creates both roles and the
# `reading` table examples/sql/sql-postgres-readonly.yaml queries.

name: dirigent

services:
  warehouse:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${WAREHOUSE_USER:-warehouse}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-warehouse}
      POSTGRES_DB: ${WAREHOUSE_DB:-warehouse}
      # Read by the seed script, so neither role's password is written into it.
      WAREHOUSE_READER_PASSWORD: ${WAREHOUSE_READER_PASSWORD:-reader-password}
      WAREHOUSE_WRITER_PASSWORD: ${WAREHOUSE_WRITER_PASSWORD:-writer-password}
    volumes:
      - warehouse:/var/lib/postgresql/data
      # The image runs everything here on first start, and only on first start: a volume that
      # already holds a database is left untouched.
      - ./examples/sql/warehouse.sql:/docker-entrypoint-initdb.d/warehouse.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER:-warehouse} -d ${WAREHOUSE_DB:-warehouse}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      # Bound to loopback, and on a different host port from the stack's own postgres so both
      # can be inspected at once. The stack reaches this over the compose network.
      - "127.0.0.1:${WAREHOUSE_PORT:-5433}:5432"

  # Only the keys that differ from compose.yaml: compose merges the rest.
  worker:
    depends_on:
      warehouse:
        condition: service_healthy

volumes:
  warehouse:
