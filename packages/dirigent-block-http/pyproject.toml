[project]
name = "dirigent-block-http"
version = "0.18.1"
description = "The HTTP block family for dirigent: http.request, http.ready, webhook.post, and the http connection kind."
readme = "README.md"
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "dirigent-common==0.18.1",
    "dirigent-plugin==0.18.1",
    "httpx2>=2.12.0",
]

[project.entry-points."dirigent.plugins.v1"]
block-http = "dirigent_block_http:plugin"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
dirigent-common = { workspace = true }
dirigent-plugin = { workspace = true }
