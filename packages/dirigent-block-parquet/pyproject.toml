[project]
name = "dirigent-block-parquet"
version = "0.16.7"
description = "The parquet block family for dirigent: the convert.arrow codec, on pyarrow."
readme = "README.md"
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "dirigent-common==0.16.7",
    "dirigent-plugin==0.16.7",
    "pyarrow>=21.0.0",
]

[project.entry-points."dirigent.plugins.v1"]
block-parquet = "dirigent_block_parquet:plugin"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
dirigent-plugin = { workspace = true }
dirigent-common = { workspace = true }
