[project]
name = "dirigent-block-transform-jq"
version = "0.16.7"
description = "The jq engine for dirigent's transform verbs: transform.jq, map.jq and filter.jq."
readme = "README.md"
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "dirigent-common==0.16.7",
    "dirigent-plugin==0.16.7",
    "jq>=1.8",
]

[project.entry-points."dirigent.plugins.v1"]
block-transform-jq = "dirigent_block_transform_jq:plugin"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
dirigent-common = { workspace = true }
dirigent-plugin = { workspace = true }
