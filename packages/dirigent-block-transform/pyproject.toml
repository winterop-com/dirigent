[project]
name = "dirigent-block-transform"
version = "0.16.7"
description = "The transform block family for dirigent: the jq blocks and the convert.std codec."
readme = "README.md"
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "dirigent-common==0.16.7",
    "dirigent-plugin==0.16.7",
    "jq>=1.8",
    "pyyaml>=6.0.3",
]

[project.entry-points."dirigent.plugins.v1"]
block-transform = "dirigent_block_transform:plugin"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
dirigent-common = { workspace = true }
dirigent-plugin = { workspace = true }
