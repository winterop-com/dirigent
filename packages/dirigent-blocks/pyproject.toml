[project]
name = "dirigent-blocks"
version = "0.17.0"
description = "The built-in pack for dirigent: every block family, and the outbound alert channels."
readme = "README.md"
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "aiosmtplib>=5.1.2",
    "dirigent-block-base==0.17.0",
    "dirigent-block-execute==0.17.0",
    "dirigent-block-http==0.17.0",
    "dirigent-block-jq==0.17.0",
    "dirigent-block-queues==0.17.0",
    "dirigent-block-sql==0.17.0",
    "dirigent-block-storage==0.17.0",
    "dirigent-common==0.17.0",
    "dirigent-plugin==0.17.0",
    "httpx2>=2.12.0",
    "structlog>=25.5.0",
]

[project.entry-points."dirigent.plugins.v1"]
builtin = "dirigent_blocks:plugin"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
dirigent-block-base = { workspace = true }
dirigent-block-execute = { workspace = true }
dirigent-block-http = { workspace = true }
dirigent-block-jq = { workspace = true }
dirigent-block-queues = { workspace = true }
dirigent-block-sql = { workspace = true }
dirigent-block-storage = { workspace = true }
dirigent-common = { workspace = true }
dirigent-plugin = { workspace = true }
