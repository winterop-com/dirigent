[project]
name = "dirigent-cli"
version = "0.9.1"
description = "The dirigent command line interface (dirigent / dg)."
readme = "README.md"
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
dependencies = [
    "dirigent-blocks",
    "dirigent-client",
    "dirigent-common",
    "dirigent-core",
    "dirigent-plugin",
    "dirigent-server",
    "httpx2>=2.12.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tomli-w>=1.2.0",
    "typer>=0.27.2",
    "uvicorn>=0.52.4",
]

[project.scripts]
dirigent = "dirigent_cli.main:run"
dg = "dirigent_cli.main:run"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
dirigent-blocks = { workspace = true }
dirigent-client = { workspace = true }
dirigent-core = { workspace = true }
dirigent-plugin = { workspace = true }
dirigent-server = { workspace = true }
