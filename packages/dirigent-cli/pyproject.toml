[project]
name = "dirigent-cli"
version = "0.17.2"
description = "The dirigent command line interface (dirigent / dg)."
readme = "README.md"
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "dirigent-block-execute==0.17.2",
    "dirigent-blocks==0.17.2",
    "dirigent-client==0.17.2",
    "dirigent-common==0.17.2",
    "dirigent-core==0.17.2",
    "dirigent-examples==0.17.2",
    "dirigent-plugin==0.17.2",
    "dirigent-server==0.17.2",
    "httpx2>=2.12.0",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "textual>=8.0",
    "tomli-w>=1.2.0",
    "typer>=0.27.2",
    "uvicorn>=0.52.4",
]

[project.scripts]
dirigent = "dirigent_cli.main:run"
dg = "dirigent_cli.main:run"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
dirigent-block-execute = { workspace = true }
dirigent-blocks = { workspace = true }
dirigent-client = { workspace = true }
dirigent-core = { workspace = true }
dirigent-examples = { workspace = true }
dirigent-plugin = { workspace = true }
dirigent-server = { workspace = true }
