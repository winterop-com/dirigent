# One pipeline running another, and waiting for it.
#
# pipeline.run is the step that runs another pipeline. The child keeps its own name, its own
# schedule, its own concurrency policy, and its own run history.
#
# A dirigent document holds exactly one pipeline, so composition is two files and the apply
# order matters: the child has to exist before the parent can be applied at all. That is
# what `requires.pipelines` below is for -- applying this document to an instance without
# composition-child is refused up front, with the reason.
#
#   dg apply examples/composition/composition-child.yaml
#   dg apply examples/composition/composition-parent.yaml
#   dg run composition-parent -p day=2026-01-01 --watch
#
# Locally there is no instance to have applied the child to, so hand it over:
#   dg run --local examples/composition/composition-parent.yaml \
#     --also-apply examples/composition/composition-child.yaml -p day=2026-01-01
#
# The two calls differ. load_north waits: it is submit-then-probe, so
# the parent's step is a parked row rather than a held worker, and archive_note only runs
# once the child has finished. notify_south does not wait -- wait: false finishes the step
# the moment the child run exists -- which is the fire-and-forget shape, and its output
# carries the child's run id so an operator can still find it.
#
# poll: 1s is here so the example finishes while you watch it. A real parent waiting on an
# hour-long child leaves it out and lets the block's own five-second cadence apply.

format: dirigent/v1
kind: pipeline
code: composition-parent
name: The calling pipeline
description: Run the child pipeline for two regions, waiting for one and not for the other.

tags: [composition, execute, pipeline, starter]

requires:
  blocks:
    - pipeline.run
    - shell.run
  pipelines:
    - composition-child

params:
  type: object
  required: [day]
  additionalProperties: false
  properties:
    day:
      type: string
      format: date
      description: The day both child runs load.

steps:
  load_north:
    block: pipeline.run
    poll: 1s
    deadline: 2m
    config:
      pipeline: composition-child
      # wait holds this step open until the child settles, so what follows can depend on it.
      wait: true
      # strict: false lets a failed child come back as this step's output rather than as
      # this step's failure, which is what makes the child's outcome something to branch on.
      strict: false
      # A child may start its own children. The depth bounds that, so a pipeline that ends
      # up calling itself stops at a stated limit instead of filling the queue.
      max_depth: 3
      params:
        region: north
        day: "${params.day}"

  notify_south:
    block: pipeline.run
    config:
      pipeline: composition-child
      # Started and forgotten: this step settles as soon as the child run exists, so nothing
      # here can read the child's result and nothing waits for it.
      wait: false
      params:
        region: south
        day: "${params.day}"

  archive_note:
    block: shell.run
    depends_on: [load_north, notify_south]
    config:
      argv:
        - echo
        - "north finished as ${steps.load_north.output.status}; south is run ${steps.notify_south.output.run_id}"
