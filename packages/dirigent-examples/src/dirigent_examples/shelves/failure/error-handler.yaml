# Error handling drawn in the DAG rather than coded inside a block.
#
# rule is the edge condition on a step's depends_on. Four values, and they are the whole
# vocabulary for branching on an outcome:
#
#   all_success  (the default) every prerequisite succeeded
#   one_failed   at least one prerequisite failed; skipped when none did
#   all_done     every prerequisite settled, whatever it settled as
#   always       runs once every prerequisite has settled, whatever the outcome -- the
#                engine still waits for upstream to finish, it does not fire mid-flight
#
# one_failed is what makes a step an error-handler branch. all_done is where cleanup that
# must happen either way belongs. Both are visible in the graph, which is the point: the
# failure path is drawn in the DAG rather than coded inside a block.
#
# There is one other failure knob, and it is a different question. rule decides whether a
# step runs; continue_on_failure decides whether a step that failed sinks the run. A step
# marked continue_on_failure: true settles as failed, but its dependents are shown a success,
# so their all_success edges fire and the branch carries on, while the run ends
# completed_with_errors instead of failed. That is also why a one_failed handler below a
# tolerated step never runs: the rules are shown no failure to handle. optional-step.yaml is
# that flag on its own. Use it for the branch nobody should be paged about; use rule for the
# branch that exists to handle the failure.
# For a fan-out the equivalent is items: continue, which tolerates one bad element rather
# than one bad step.
#
# As written the load fails, so the notify branch runs and the success branch is skipped.
# The load is a playground.generate step with `fail_until` set, which fails the attempts
# inside that window on purpose, so the failing path is real and reaches nothing to fail at.
#
# This one uses shell.run, which executes code on the worker and is refused unless the
# instance allowlists it: export DIRIGENT_ENABLED_UNSAFE_BLOCKS='["shell.run"]', or pass
# --enable-unsafe shell.run to a local run.
#
#   dg run --local examples/failure/error-handler.yaml
#   dg run --local examples/failure/error-handler.yaml -p fail_until=0   # the other branch

format: dirigent/v1
kind: pipeline
code: error-handler
name: Handle a failing step
description: Load a batch, alert on failure, and always release the lock afterwards.

tags: [failure, execute, playground, graph]

params:
  type: object
  properties:
    fail_until:
      type: integer
      description: How many of the load's attempts fail; 0 makes it succeed on the first.
      default: 9
      minimum: 0
      maximum: 9

steps:
  load_batch:
    block: playground.generate
    retry:
      max_attempts: 2
      backoff: 1s
    config:
      # Both attempts are inside the failing window, so the budget is spent and the step
      # settles failed. The failure is classified transient, which is what a budget buys.
      fail_until: "${params.fail_until}"
      rows: 3
      seed: 4

  notify_failure:
    block: playground.generate
    depends_on: [load_batch]
    # one_failed is what makes this a handler: it runs only on the path where the load
    # failed, and skips silently on the path where it did not.
    rule: one_failed
    config:
      input:
        text: the nightly load failed

  publish_success:
    block: shell.run
    depends_on: [load_batch]
    rule: all_success
    config:
      argv: [echo, "load succeeded"]

  release_lock:
    block: playground.generate
    depends_on: [notify_failure, publish_success]
    # Exactly one of the two branches above runs and the other skips, so all_done is what
    # releases the lock either way. all_success would wait for a step that never runs.
    rule: all_done
    config:
      input:
        released: nightly-load
