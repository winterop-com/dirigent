# A four-step chain, and how one step reads another's output.
#
# depends_on draws the edge; ${steps.<name>.output.<field>} reads across it. A step may
# only read from a step it depends on, transitively, and apply checks that: the reference
# language has no way to reach sideways into an unrelated branch.
#
# The answer travels as a value in the fetch step's output, and storage.write is what puts
# it in the run's scratch space, so the copy step has a real object to move.
#
# playground.generate stands in for the source read, so the chain runs with nothing to reach:
# no connection, no URL, no network. Swapping it for an http.request whose body the store step
# reads changes that one step and nothing below it.
#
# report uses shell.run, which executes code on the worker and is refused unless the
# instance allowlists it:
#   export DIRIGENT_ENABLED_UNSAFE_BLOCKS='["shell.run"]'
#   dg run --local examples/graph/linear.yaml -p day=2026-01-01
# or, without touching the environment:
#   dg run --local examples/graph/linear.yaml -p day=2026-01-01 --enable-unsafe shell.run

format: dirigent/v1
kind: pipeline
code: linear
name: A straight line of steps
description: Generate a payload, store it, archive the object, then report what was archived.

tags: [graph, execute, playground, storage]

params:
  type: object
  required: [day]
  properties:
    day:
      type: string
      format: date

steps:
  fetch:
    block: playground.generate
    config:
      rows: 4
      seed: 11
      fields:
        station: license_plate
        celsius:
          provider: pyfloat
          args:
            min_value: -10
            max_value: 30
            right_digits: 1

  store:
    block: storage.write
    depends_on: [fetch]
    config:
      # storage.write is the only way a value leaves the run, so the answer the fetch
      # carries becomes an object here and nowhere else.
      target: "${run.scratch}/incoming/${params.day}.json"
      value: "${steps.fetch.output.records}"

  archive:
    block: storage.copy
    # depends_on is what orders the run; nothing infers an edge from one step reading
    # another's output, so the dependency is stated even though the reference implies it.
    depends_on: [store]
    config:
      source: "${steps.store.output.uri}"
      target: "${run.scratch}/archive/${params.day}.json"

  report:
    block: shell.run
    depends_on: [archive]
    config:
      argv:
        - echo
        - "read ${steps.fetch.output.rows} rows, archived ${steps.archive.output.bytes_copied} bytes"
