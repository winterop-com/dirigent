# Two fan-outs over one grid: item three of the second reads item three of the first.
#
# A fanned step's output is the list of its items' outputs, so a step that depends on a
# fan-out sees the whole batch. That is right for a join and wrong for everything that is
# still per item: writing one file per district, calling one endpoint per region, sending one
# message per order. Those want the matching item, not the list.
#
# for_each: ${steps.<name>.items} is that. The step maps over the grid the named fan-out
# already has instead of a grid of its own, and the two are paired by position: item 3 here is
# item 3 there, ${item} is the same element in both, and ${steps.<name>.item.output} is the
# matching item's output.
#
# Three things the pairing buys, and one it costs:
#
#   1. Cardinality is still fixed when the run is created. The grid comes from a step that was
#      itself expanded then, so nothing here waits on execution to know how wide it is.
#   2. The names must be a direct dependency: the adopted step goes in depends_on. Pairing
#      across a step that is not waited for would read an item that has not run.
#   3. Adoption chains. A third step may map over the second's items and still reach the
#      first's, because they are all one grid.
#   4. The cost: an item whose match did not succeed is SKIPPED, not failed and not run. Its
#      input never existed, so there is nothing to attempt. The rest of the grid carries on.
#
# Hop by hop:
#
#   shape      transform.jq, once per region. Under items: continue a region that refuses is
#              recorded against its own item and the others finish.
#   write_one  storage.write, mapping over shape's grid rather than a list of its own. One
#              file per region, named for ${item}, holding ${steps.shape.item.output.value} --
#              that region's own object, not the batch.
#   manifest   the join, with no for_each at all: one attempt over the whole list of files.
#
# EXPECT THIS RUN TO SUCCEED in about a second, with three files written and a manifest naming
# all three.
#
# To change it: -p refuse=west makes shape's west item fail, which skips write_one's west item
# rather than failing it, leaves the other two written, and ends the run
# completed_with_errors with a manifest of two files.
#
#   dg run --local examples/patterns/fan-out-item-wise.yaml
#   dg run --local examples/patterns/fan-out-item-wise.yaml -p refuse=west  # completed_with_errors

format: dirigent/v1
kind: pipeline
code: fan-out-item-wise
name: One item to one item
description: |
  `for_each: ${steps.<name>.items}` maps a step over another fan-out's grid, so the two are
  paired by item position and `${steps.<name>.item.output}` is the matching item's output.

  An item whose match did not succeed is skipped rather than failed, and the rest of the grid
  carries on.

tags: [patterns, storage, transform, fan-out, references, starter]

requires:
  blocks:
    - storage.write
    - transform.jq

params:
  type: object
  properties:
    regions:
      type: array
      default: [east, west, north]
      minItems: 1
      maxItems: 16
      items:
        type: string
      description: One item, one file, per element.
    refuse:
      type: string
      default: ""
      description: A region whose shape step fails, so its write is skipped rather than run.

steps:
  shape:
    block: transform.jq
    for_each: "${params.regions}"
    items: continue
    config:
      input:
        region: "${item}"
        refuse: "${params.refuse}"
      # error() is how a jq program fails one item deliberately; without the refuse knob this
      # program is just the object-building half.
      program: |
        if .region == .refuse then error("region \(.region) refused the export")
        else {region: .region, rows: [{station: "\(.region)-st-0", celsius: -4}]}
        end

  write_one:
    block: storage.write
    depends_on: [shape]
    # The whole point of the file: this step has no grid of its own, it takes shape's.
    for_each: "${steps.shape.items}"
    config:
      # ${item} is shape's element, so two items never write the same key.
      target: "${run.scratch}/regions/${item}.json"
      # ...and this is that element's own output, not the list of every item's.
      value: "${steps.shape.item.output.value}"

  manifest:
    block: transform.jq
    depends_on: [write_one]
    # No for_each, so this is the join: one attempt, and the batch arrives as a list.
    config:
      input: "${steps.write_one.output}"
      program: |
        {files: length, uris: [.[].uri], total_bytes: ([.[].bytes_written] | add)}
