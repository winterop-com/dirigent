# Which failures are retried, and which are refused another attempt however much budget is left.
#
# The budget is not the whole story. Before the engine spends an attempt it asks the block
# what kind of failure it was, and there are exactly three answers:
#
#   transient  a network error, a 5xx, a timeout       retried while the budget lasts
#   rejected   a validation error, auth, a 4xx         never retried, whatever the budget says
#   unknown    anything the block declines to classify  retried while the budget lasts
#
# Only rejected ends a step on its first failure. unknown is retried, which surprises people:
# a block that cannot tell a corrupt input from a database that was briefly away declines to
# guess, and the engine spends the budget rather than assuming the worst.
#
# playground.generate classifies both ways, which is why it can show them side by side:
# `fail_until` fails on cue and is classified transient, because the point of the knob is a
# retry; a field map naming a provider the installed Faker does not have is a configuration
# error, so it is rejected. The two steps below carry the SAME retry policy, so the difference
# cannot be the policy.
#
# Hop by hop:
#
#   transient_error  fail_until above its budget. Transient, so all three attempts are spent:
#                    1s, then 2s.
#   rejected_error   a provider that does not exist. Rejected, so one attempt and no more --
#                    the identical max_attempts: 3 below it buys nothing, because no later
#                    attempt is going to invent the provider.
#   compare          all_done on both, so it runs whatever they did and gives the run
#                    something to end on.
#
# EXPECT THIS RUN TO END completed_with_errors, in about four seconds. Read the attempt
# counts: transient_error has three, rejected_error has one. Both failures are tolerated,
# which is why the run is completed_with_errors and not failed.
#
# To change it: -p provider=name is a provider that does exist, so the second step succeeds
# on its first attempt -- one attempt either way, because a rejection and a success both
# settle immediately and only a transient failure buys another try.
#
#   dg run --local examples/patterns/retry-only-transient.yaml                   # completed_with_errors
#   dg run --local examples/patterns/retry-only-transient.yaml -p provider=name  # the second step lands

format: dirigent/v1
kind: pipeline
code: retry-only-transient
name: Transient retries, rejected does not
description: |
  The same three-attempt budget on two steps: a transient failure spends all three, a
  rejected one spends one.

  The block classifies (`transient`, `rejected`, `unknown`) and the engine decides. Only
  `rejected` is refused another attempt, however much budget is left.

tags: [patterns, playground, failure, retry]

requires:
  blocks:
    - playground.generate
    - value.const

params:
  type: object
  properties:
    fail_until:
      type: integer
      description: How many of the first step's attempts fail; above its budget, all of them.
      default: 9
      minimum: 0
      maximum: 9
    provider:
      type: string
      description: The Faker provider the second step names; one that does not exist is rejected.
      default: not-a-provider

steps:
  transient_error:
    block: playground.generate
    continue_on_failure: true
    retry:
      max_attempts: 3
      backoff: 1s
      multiplier: 2.0
      max_backoff: 4s
      jitter: 0.0
    config:
      # Classified transient, because a step that fails on cue is standing in for a network
      # having a moment, and that is what a budget is for.
      fail_until: "${params.fail_until}"

  rejected_error:
    block: playground.generate
    continue_on_failure: true
    # Character for character the policy above. That is the point: the budget is identical
    # and the number of attempts is not, because the classification differs.
    retry:
      max_attempts: 3
      backoff: 1s
      multiplier: 2.0
      max_backoff: 4s
      jitter: 0.0
    config:
      # A provider the installed Faker does not have. Classified rejected, because no later
      # attempt is going to make the name exist.
      fields:
        who: "${params.provider}"

  compare:
    block: value.const
    depends_on: [transient_error, rejected_error]
    # Both prerequisites are tolerated failures, so their dependents are shown a success and
    # the default rule would fire. all_done is written anyway, because this step's job is to
    # be reached whatever happened above it, and saying so is cheaper than remembering why.
    rule: all_done
    config:
      value:
        transient: three attempts
        rejected: one attempt
