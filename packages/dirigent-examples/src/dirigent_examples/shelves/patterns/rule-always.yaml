# always: the widest edge there is, and the one thing it still waits for.
#
# always runs a step once every prerequisite has settled, whatever the outcome. It is the rule
# for a final accounting step at the bottom of a graph that has skipped branches in it, where
# all_success could never fire and all_done would be doing the same job with a narrower
# promise.
#
# THE ENGINE STILL WAITS. always does not mean "run me immediately" and it does not mean "run
# me alongside my prerequisites". Nothing in dirigent fires a step mid-flight; always is about
# the outcome being ignored, never about the ordering being ignored.
#
# Hop by hop:
#
#   load        a playground.generate step with fail_until: 1, so its one attempt fails.
#   handler     one_failed on the load, so it runs on the failing path and skips on the green one.
#   optimistic  all_success on the load, so it does the opposite.
#   summary     always, on all three. One of handler and optimistic is skipped on every
#               possible run, so this edge is the only one that fires either way.
#
# EXPECT THIS RUN TO FAIL. summary runs and succeeds; the load is failed and untolerated, so
# the run is failed. Pass -p fail_until=0 and summary runs just the same, off the other
# branch, and the run succeeds.
#
#   dg run --local examples/patterns/rule-always.yaml                    # fails; summary runs anyway
#   dg run --local examples/patterns/rule-always.yaml -p fail_until=0    # succeeds

format: dirigent/v1
kind: pipeline
code: rule-always
name: The always edge
description: |
  `rule: always` runs a step once every prerequisite has settled, whatever they settled as
  and however many of them were skipped.

  It ignores the outcome, never the ordering: the engine still waits for upstream to
  finish. As written the run reports `failed` with the summary delivered.

tags: [patterns, playground, graph, rules]

requires:
  blocks:
    - playground.generate

params:
  type: object
  properties:
    fail_until:
      type: integer
      description: How many of the load's attempts fail; 1 fails it, 0 makes it succeed.
      default: 1
      enum: [0, 1]

steps:
  load:
    block: playground.generate
    config:
      # `fail_until: 1` fails the first attempt, and with no retry policy there is no second
      # one, so the step settles failed with nothing to reach and nothing to arrange.
      fail_until: "${params.fail_until}"
      rows: 3
      seed: 6

  handler:
    block: playground.generate
    depends_on: [load]
    rule: one_failed
    config:
      input:
        text: handled

  optimistic:
    block: playground.generate
    depends_on: [load]
    config:
      input:
        text: no handling needed

  summary:
    block: playground.generate
    depends_on: [load, handler, optimistic]
    # Three prerequisites, one of which is guaranteed to be skipped on every possible run.
    # That is the shape always is for.
    rule: always
    config:
      input:
        # Nothing upstream is referenced, because under this rule nothing upstream is
        # promised. A summary that needs a value takes it from a step it can name safely.
        run: "${run.id}"
        text: the window is closed either way
