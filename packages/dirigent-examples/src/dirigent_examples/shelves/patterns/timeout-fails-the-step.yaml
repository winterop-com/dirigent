# timeout: how long ONE block call may take, and what an expired one is classified as.
#
# Three different clocks can stop a step, and they answer three different questions:
#
#   timeout          (a step field)  how long one block call may take. This file.
#   deadline         (a step field)  how long a step may keep WAITING on a sensor or a remote
#                                    job. deadline-on-a-sensor.yaml.
#   timeout          (block config)  the block's own limit on its own work, such as the HTTP
#                                    client's socket timeout. recipes/http-timeout-override.yaml
#                                    is the file where all three sit around one call.
#
# The two on slow_read below are set deliberately far apart: the step is asked to take ten
# seconds and the engine allows two. So the engine is plainly the clock that fires, and the
# attempt says so.
#
# An expired timeout is a TRANSIENT failure, which matters more than it looks: a retry budget
# would be spent on it, three attempts against a call that is always too slow costing three
# full timeouts of waiting. There is no retry policy here for exactly that reason -- a
# deadline that cannot be met is not a flake. And note what on_timeout does NOT do: it governs
# an expired deadline, never an expired timeout, so there is no spelling of this step that
# skips instead of failing. timeout-skips-the-step.yaml is where that distinction lives.
#
# Hop by hop:
#
#   start      a local value, so the run has a step that plainly succeeded to compare against.
#   slow_read  a ten-second step against a two-second budget. It loses, in about two seconds.
#   parse      the default all_success edge, so it is skipped.
#
# EXPECT THIS RUN TO FAIL, in about two seconds, with slow_read failed and parse skipped.
# It fails ON TIME, not on work: the step was healthy and would have answered.
#
# To change it: -p takes=1s finishes inside the budget and the run goes green. Widen the
# step's timeout past ten seconds and the same happens.
#
#   dg run --local examples/patterns/timeout-fails-the-step.yaml               # fails in ~2s
#   dg run --local examples/patterns/timeout-fails-the-step.yaml -p takes=1s   # succeeds

format: dirigent/v1
kind: pipeline
code: timeout-fails-the-step
name: A step that runs out of time
description: |
  `timeout` bounds one block call. An expired one is a **transient** failure, so a retry
  budget would be spent on it -- which is why this step has none.

  As written a ten-second step is given two seconds, it fails in about two, and the run
  reports `failed`.

tags: [patterns, playground, transform, failure, timeout]

requires:
  blocks:
    - playground.generate
    - value.const

params:
  type: object
  properties:
    takes:
      type: string
      description: How long the step is asked to take. Anything above the two-second budget loses.
      default: 10s

steps:
  start:
    block: value.const
    config:
      value:
        note: everything above the failing step is ordinary

  slow_read:
    block: playground.generate
    depends_on: [start]
    # The budget the engine holds the call to. It is the shorter of the two clocks in this
    # file, which is what makes it the one that fires.
    timeout: 2s
    config:
      # A configured duration is humane, so 10s and 500ms both read as durations.
      delay: "${params.takes}"

  parse:
    block: transform.jq
    depends_on: [slow_read]
    # Skipped. An abandoned attempt is a failure like any other as far as the edge is
    # concerned; there is no separate "timed out" outcome for a rule to branch on.
    config:
      input: "${steps.slow_read.output.delay_ms}"
      program: |
        {delayed_ms: .}
