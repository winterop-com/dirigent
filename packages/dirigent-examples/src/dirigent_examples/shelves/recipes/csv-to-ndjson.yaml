# A csv turned into ndjson, and the one thing the conversion will not do for you: types.
#
# In:  an inline csv with a header row -- station, date, celsius, active.
# Out: ndjson in the run's scratch space, one JSON object per line, and beside it the same
#      records with celsius as a number and active as a boolean.
#
# All three text formats convert.std knows say the same thing -- a sequence of records --
# so a conversion is reading that sequence out of one spelling and writing it in another.
# csv to ndjson is the one a line-oriented sink wants, because a consumer can read one line
# at a time instead of holding the whole array.
#
# A convert step is a storage operation, the way storage.copy is: it reads one URI and
# writes another, and no record passes through the step itself. So the csv is put at a URI
# first and the ndjson is read back from one afterwards, which is the three hops below.
#
#   source    storage.write, the inline csv at a URI. A real pipeline writes the body an
#             http.request answered with here instead, and nothing else in the document
#             moves.
#   as_ndjson convert.std csv -> ndjson. Output: source, target, bytes_written.
#   lines     storage.read of the target. Nothing recognises the .ndjson extension, so the
#             step says what the object is; application/x-ndjson is text rather than the
#             JSON family, so it comes back as `text`.
#
# Every cell read out of a csv is a string. "4.5" comes back as the three characters, not as
# a number, because a csv carries no types and a codec that guessed would be wrong on the
# column where 007 is a code and 1-2 is a range. So the typing step is a jq program, in the
# document that knows what the columns mean, and it is the second half of every csv read.
#
# ndjson is one JSON value per line, which is why the typing program splits on newlines,
# drops the empty last one, and fromjson each.
#
# st-3 has no celsius, and the typing program keeps it that way: an empty cell in a numeric
# column becomes null, because a station that reported nothing did not report zero. null is the
# right rule for a numeric column and the wrong one for a text column, so the rule is written
# per column.
#
#   dg run --local examples/recipes/csv-to-ndjson.yaml

format: dirigent/v1
kind: pipeline
code: csv-to-ndjson
name: CSV to ndjson, with the typing that follows
description: |
  Turn a csv into one JSON object per line, then give the cells their real types.

  Every cell a csv brings in is a string, and the typing step gives each one the type its column
  actually has.

tags: [recipes, storage, transform]

requires:
  blocks:
    - storage.write
    - convert.std
    - storage.read
    - transform.jq

steps:
  source:
    block: storage.write
    config:
      target: ${run.scratch}/readings.csv
      text: |
        station,date,celsius,active
        st-1,2026-01-01,4.5,true
        st-2,2026-01-01,-1,false
        st-3,2026-01-01,,true
      content_type: text/csv

  as_ndjson:
    block: convert.std
    depends_on: [source]
    config:
      source: ${steps.source.output.uri}
      target: ${run.scratch}/readings.ndjson
      from: csv
      to: ndjson

  lines:
    block: storage.read
    depends_on: [as_ndjson]
    config:
      source: ${steps.as_ndjson.output.target}
      content_type: application/x-ndjson

  typed:
    block: transform.jq
    depends_on: [lines]
    config:
      input: ${steps.lines.output.text}
      program: |
        [split("\n")[]
         | select(length > 0)
         | fromjson
         | {station,
            date,
            celsius: (if .celsius == "" then null else (.celsius | tonumber) end),
            active: (.active == "true")}]
