# POST a file that lives in storage: read it, then send what the read brought back.
#
# In:  a table of readings generated inline and written to the run's scratch space.
# Out: the echo service's view of the upload -- the size it received and the content type it
#      was told -- beside the size the file actually is.
#
# A file is bytes at a URI, and a request sends a value, so the hop between them is a
# storage.read step. Four hops:
#
#   build     transform.jq, the payload a real pipeline would have fetched.
#   file      storage.write, the value to a URI. Output: uri, bytes_written, content_type.
#   load      storage.read, the same URI. The object is application/json, so it comes back
#             as `value`; max_size is how much of it this step will hold, and an object
#             past it is refused rather than truncated.
#   upload    http.request. body is that value, serialised and sent as JSON by the block, so
#             nothing here builds a request out of strings.
#
# HOW BIG A FILE THIS SENDS. Everything above passes through the worker, so the file has to
# fit in it twice over: once in the read, once in the request. That is the trade for being
# able to look at what is sent. Bytes nobody has to look at move between URIs with
# storage.copy instead, bounded by the storage rather than by the worker, and a body coming
# back the other way is bounded by max_response.
#
# The file is addressed as ${steps.file.output.uri} rather than typed twice, so one step
# decides where it went and a rename is a one-line change. A missing object is a rejected
# read, not a retried one: calling again cannot make a file appear that was never written.
#
# To change it: point the write at s3://<bucket>/... and the read follows it, because the
# scheme is the only thing that changes.
#
#   dg run --local examples/recipes/http-post-file-from-storage.yaml
#   dg run --local examples/recipes/http-post-file-from-storage.yaml -p stations=500

format: dirigent/v1
kind: pipeline
code: http-post-file-from-storage
name: POST a file read out of storage
description: Write a file into the run's scratch space, read it back with storage.read, and POST what the read brought back.

tags: [recipes, http, storage, transform]

requires:
  blocks:
    - transform.jq
    - storage.write
    - storage.read
    - http.request

params:
  type: object
  properties:
    day:
      type: string
      format: date
      default: "2026-01-01"
      description: The day the uploaded file is named for.
    stations:
      type: integer
      minimum: 1
      default: 40
      description: How many rows the file holds, which is what makes it big enough to matter.

steps:
  build:
    block: transform.jq
    config:
      input:
        count: ${params.stations}
        day: ${params.day}
      program: |
        . as {$count, $day}
        | {day: $day,
           readings: [range($count)
                      | {station: "st-\(.)", celsius: (. % 17) - 5}]}

  file:
    block: storage.write
    depends_on: [build]
    config:
      target: ${run.scratch}/readings-${params.day}.json
      value: ${steps.build.output.value}

  load:
    block: storage.read
    depends_on: [file]
    config:
      source: ${steps.file.output.uri}
      max_size: 8mb

  upload:
    block: http.request
    depends_on: [load]
    config:
      url: https://postman-echo.com/post
      method: POST
      # A value, so the block serialises it and sends it as application/json. An endpoint
      # that wants some other type is told with content_type.
      body: ${steps.load.output.value}
      timeout: 30s

  receipt:
    block: transform.jq
    depends_on: [file, load, upload]
    config:
      input:
        written: ${steps.file.output.bytes_written}
        read: ${steps.load.output.bytes_read}
        echoed: ${steps.upload.output.body}
      program: |
        {written, read,
         # What the receiver was told the body was, and how much of it arrived.
         content_type: .echoed.headers["content-type"],
         received: (.echoed.headers["content-length"] | tonumber),
         rows: (.echoed.json.readings | length),
         # The file and the read agree on one number, and the receiver counted the same
         # bytes back out of the request.
         intact: (.written == .read and .read == (.echoed.headers["content-length"] | tonumber))}
