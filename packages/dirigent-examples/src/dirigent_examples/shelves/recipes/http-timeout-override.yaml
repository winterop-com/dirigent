# Three deadlines sit around one HTTP call. Know which one you are setting.
#
# In:  a delay, as a parameter, defaulting to 2s.
# Out: a slow call that completes inside its own timeout, and its measured duration.
#
# The three, from the inside out:
#
#   timeout on the step's config             how long this one call may take before the
#                                            client gives up. It overrides the connection's
#                                            timeout for this call and nothing else.
#   timeout on the connection                the default for every call made through it,
#                                            which is where a slow API's whole profile
#                                            belongs rather than in each step.
#   timeout on the step                      the engine's deadline on the attempt, which
#                                            covers the block's entire execution, retries of
#                                            an inner operation included. It is step-level
#                                            engine semantics, uniform across every block,
#                                            and it is what kills a step that hangs somewhere
#                                            the HTTP client is not.
#
# The inner one is the one to reach for when a single endpoint is slow: a report that takes
# forty seconds to build does not justify raising the deadline on every call to that host,
# and a health check that should answer in one second is a step-level override in the other
# direction.
#
# GET /api/v1/playground/request?delay=<duration> answers after the time it is given, so the
# relationship is visible: with the default the call takes about 2s against a 10s budget and
# the run is green. Setting -p delay=6s against -p timeout=3s fails the step instead, as a
# timeout rather than as an error the server returned.
#
# NEEDS AN INSTANCE TO CALL. The playground is served by a dirigent instance under
# /api/v1/playground, unauthenticated, so a document teaching HTTP calls its own instance and
# nothing on the public internet. Start one first, in the project this runs from:
#
#   dg dev
#
# `dg run --local` builds a throwaway database and mounts no API of its own, so it reaches the
# playground the same way anything else does: over the network, at the URL below.

#
# The engine's own step timeout is set here too, comfortably above the call's, so that a
# hang outside the HTTP client -- a name that never resolves, a socket that never closes --
# still ends the attempt.
#
# To change it: -p delay=6s -p timeout=3s to see the failure, or -p delay=1s for a fast run.
#
#   dg dev &
#   dg run --local examples/recipes/http-timeout-override.yaml
#   dg run --local examples/recipes/http-timeout-override.yaml -p delay=6s -p timeout=3s   # fails, on purpose

format: dirigent/v1
kind: pipeline
code: http-timeout-override
name: A per-call timeout override
description: |
  Give one slow call a longer timeout than its connection allows.

  The override applies to that call alone, and sits under an engine step deadline that covers the
  whole attempt.

tags: [recipes, http, transform]

requires:
  blocks:
    - http.request
    - transform.jq

connections:
  playground-slow:
    name: Playground, 3s timeout
    description: |
      The playground with a 3 second default timeout, short enough that a per-step override has
      work to do. Used by `http-timeout-override`.
    kind: http
    config:
      base_url: http://127.0.0.1:3333/api/v1/playground
      # The default for every call through this connection. Deliberately short, so the
      # override below is doing real work.
      timeout: 3s
      health_path: /request

params:
  type: object
  properties:
    delay:
      type: string
      default: 2s
      description: How long the route waits before answering; a humane duration.
    timeout:
      type: string
      default: 10s
      description: This call's own deadline, a humane duration, overriding the connection's 3s.

steps:
  slow:
    block: http.request
    # The engine's deadline on the whole attempt, well above the call's own, so a hang
    # outside the HTTP client still ends the step.
    timeout: 60s
    config:
      connection: playground-slow
      path: /request
      method: GET
      query:
        delay: ${params.delay}
      # This call alone; every other call through playground-slow keeps the 3 second default.
      timeout: ${params.timeout}

  timing:
    block: transform.jq
    depends_on: [slow]
    config:
      input:
        status: ${steps.slow.output.status}
        duration_ms: ${steps.slow.output.duration_ms}
        budget: ${params.timeout}
      # A duration is text with a unit, so the budget is turned into milliseconds here to be
      # compared with what the call measured.
      program: |
        def milliseconds:
          capture("^(?<amount>[0-9.]+)(?<unit>ms|s|m|h)$")
          | (.amount | tonumber) * {"ms": 1, "s": 1000, "m": 60000, "h": 3600000}[.unit];
        (.budget | milliseconds) as $budget
        | {status, duration_ms,
           budget_ms: $budget,
           # A call that lands close to its budget is a call about to start failing
           # intermittently, which is worth reporting before it does.
           headroom_ms: ($budget - .duration_ms)}
