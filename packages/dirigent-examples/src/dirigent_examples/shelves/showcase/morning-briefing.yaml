# Four feeds, filtered and banded one feed at a time, joined into the page somebody reads.
#
# The other two documents on this shelf are about the night the data arrives. This is about
# the morning after it: four feeds already collected, each narrowed to what is worth reading,
# each reading labelled, and the four summaries joined into one briefing with a gate on it.
#
# In:  a day, and four feeds each carrying its own readings.
# Out: a markdown briefing under the run's scratch prefix, read back and logged.
#
# THE DATA IS THE DOCUMENT'S OWN, AND IT MAKES A REAL ROUND TRIP. Postman Echo has no health
# feed to serve, so each feed's readings are written here and posted to /post, which hands
# them back. What is being taught is the shape of the flow, and nothing about it changes when
# the url becomes a real one.
#
# THE JQ FAMILY IS THREE VERBS, AND EACH IS ONE HOP HERE:
#
#   filter.jq     keeps the elements a program answers true for. A list in, a shorter list out.
#   map.jq        replaces every element with what a program makes of it. Same length, new shape.
#   transform.jq  runs one program over the whole value, which is how a list becomes an object.
#
# HOP BY HOP:
#
#   pull            http.request, once per feed. The readings go out and come back.
#   recent          filter.jq, once per feed: drop everything under the threshold.
#   banded          map.jq, once per feed: label each surviving reading.
#   feed_summary    transform.jq, once per feed: the list becomes one object.
#   briefing        transform.jq, the join, with no for_each of its own.
#   check_briefing  validate.schema, the gate the page is built from rather than around.
#   page            report.render, the markdown.
#   save            storage.write, the page under the run's scratch prefix.
#   back            storage.read, the same URI, so the round trip is proven rather than assumed.
#   announce        log.write, the page's text onto the run's own timeline.
#
# EXPECT THIS RUN TO SUCCEED in about a second, with four feeds in the briefing.
#
# TO CHANGE IT: raise `threshold` and watch feeds empty out, or hand it your own feeds. A feed
# whose readings all fall below the threshold summarises as zero rather than failing, which is
# what makes the gate below worth having: an empty feed is a shape, not an error.
#
#   dg run --local examples/showcase/morning-briefing.yaml
#   dg run --local examples/showcase/morning-briefing.yaml -p threshold=70
#
#   dg apply examples/showcase/morning-briefing.yaml
#   dg run morning-briefing --watch

format: dirigent/v1
kind: pipeline
code: morning-briefing
name: The morning briefing
description: |
  Four feeds, each filtered to what clears a threshold, each reading banded, each summarised,
  and the four summaries joined into one gated briefing that is rendered, saved and read back.

  The three jq verbs in one document: `filter.jq` narrows a list, `map.jq` reshapes its
  elements, and `transform.jq` turns the list into an object.

tags: [showcase, http, transform, validate, storage, report, fan-out, jq, filter, map, briefing, schedule, starter]

requires:
  blocks:
    - http.request
    - filter.jq
    - map.jq
    - transform.jq
    - validate.schema
    - storage.write
    - storage.read
    - report.render
    - log.write

params:
  type: object
  properties:
    day:
      type: string
      format: date
      default: "2026-03-01"
      description: The day the briefing covers.
    threshold:
      type: integer
      default: 40
      minimum: 0
      description: Readings under this are dropped before anything is said about them.
    band_at:
      type: integer
      default: 60
      minimum: 0
      description: Readings at or above this are banded high rather than watch.
    feeds:
      type: array
      description: One element per feed, each carrying the readings that feed reported.
      minItems: 1
      maxItems: 12
      default:
        - { feed: cases, readings: [18, 42, 61, 39, 77, 54, 23] }
        - { feed: climate, readings: [31, 29, 44, 58, 66, 72, 19, 48] }
        - { feed: stockouts, readings: [5, 12, 63, 81, 47, 22] }
        - { feed: attendance, readings: [88, 91, 64, 59, 73, 45] }
      items:
        type: object
        required: [feed, readings]
        properties:
          feed: { type: string }
          readings:
            type: array
            items: { type: integer }

# Carried, so `dg run --local` has the shape without an instance holding it.
schemas:
  daily-briefing:
    type: object
    required: [day, feeds]
    additionalProperties: false
    properties:
      day: { type: string, format: date }
      readings: { type: integer, minimum: 0 }
      feeds:
        type: array
        minItems: 1
        items:
          type: object
          required: [feed, reported, kept, high]
          additionalProperties: false
          properties:
            feed: { type: string, minLength: 1 }
            reported: { type: integer, minimum: 0 }
            kept: { type: integer, minimum: 0 }
            high: { type: integer, minimum: 0 }
            peak: { type: [integer, "null"] }

steps:
  pull:
    block: http.request
    for_each: "${params.feeds}"
    items: continue
    retry:
      max_attempts: 3
      backoff: 1s
      multiplier: 2.0
      jitter: 0.2
    config:
      url: https://postman-echo.com/post
      method: POST
      body:
        feed: "${item.feed}"
        day: "${params.day}"
        readings: "${item.readings}"

  recent:
    block: filter.jq
    depends_on: [pull]
    # pull's grid, so feed three here is feed three there.
    for_each: "${steps.pull.items}"
    config:
      input: "${steps.pull.item.output.body.data.readings}"
      # A filter program answers true or false for one element; the elements it answers true
      # for are the output, in the order they arrived.
      program: ". >= ${params.threshold}"

  banded:
    block: map.jq
    depends_on: [recent]
    for_each: "${steps.recent.items}"
    config:
      input: "${steps.recent.item.output.value}"
      # A map program is run per element and its answer replaces the element, so an integer
      # becomes the object the page wants to read.
      program: "{value: ., band: (if . >= ${params.band_at} then \"high\" else \"watch\" end)}"

  feed_summary:
    block: transform.jq
    depends_on: [pull, banded]
    for_each: "${steps.banded.items}"
    config:
      input:
        feed: "${item.feed}"
        reported: "${steps.pull.item.output.body.data.readings}"
        kept: "${steps.banded.item.output.value}"
      # One program over the whole value, which is what turns a list into an object.
      program: |
        {feed: .feed,
         reported: (.reported | length),
         kept: (.kept | length),
         high: ([.kept[] | select(.band == "high")] | length),
         peak: (if (.kept | length) > 0 then ([.kept[].value] | max) else null end)}

  briefing:
    block: transform.jq
    depends_on: [feed_summary]
    # No for_each, so this is the join: one attempt over every feed's summary.
    config:
      input:
        day: "${params.day}"
        feeds: "${steps.feed_summary.output}"
      program: |
        {day: .day,
         readings: ([.feeds[].value.kept] | add),
         feeds: [.feeds[].value]}

  check_briefing:
    block: validate.schema
    depends_on: [briefing]
    config:
      input: "${steps.briefing.output.value}"
      schema: daily-briefing

  page:
    block: report.render
    depends_on: [check_briefing]
    config:
      values:
        # The gate's output, not the raw join: every value the page words is one the gate
        # already passed.
        briefing: "${steps.check_briefing.output.value}"
        threshold: "${params.threshold}"
      content_type: text/markdown
      template: |
        # Morning briefing for {{ briefing.day }}

        {{ briefing.feeds | length }} feeds, and {{ briefing.readings }} readings that cleared {{ threshold }}.

        | Feed | Reported | Kept | High | Peak |
        | --- | --- | --- | --- | --- |
        {% for feed in briefing.feeds %}
        | {{ feed.feed }} | {{ feed.reported }} | {{ feed.kept }} | {{ feed.high }} | {{ feed.peak }} |
        {% endfor %}

  save:
    block: storage.write
    depends_on: [page]
    config:
      target: "${run.scratch}/briefing-${params.day}.md"
      text: "${steps.page.output.text}"
      content_type: "${steps.page.output.content_type}"

  back:
    block: storage.read
    depends_on: [save]
    config:
      source: "${steps.save.output.uri}"
      max_size: 1mb

  announce:
    block: log.write
    depends_on: [back]
    config:
      message: the morning briefing, read back out of storage
      value: "${steps.back.output.text}"

report: {}

triggers:
  schedules:
    - code: every-morning
      name: Every morning, Oslo time
      description: Fires once the night's loads have settled.
      cron: "30 6 * * *"
      timezone: Europe/Oslo
