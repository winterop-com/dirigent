# A night's work in one document: a window, a catalogue, eight regions, and a page about it.
#
# This is the shelf's big one, and it is sized like the pipeline somebody actually operates
# rather than like the smallest thing that proves a point. Sixteen steps, six of them fanned
# out over the same grid of regions, two gates, one sensor per export job, and a tail that
# writes a page and says where it went.
#
# In:  a day, a list of regions, and a pace.
# Out: one JSON file per region under the run's scratch prefix, a manifest of them, the
#      totals across them, a markdown page saved beside them, and the run's own report.
#
# THE SHAPE, HOP BY HOP:
#
#   maintenance_window  time.window, the gate a nightly load opens behind. A sensor, so poll
#                       and deadline are the step's, and a closed window parks rather than
#                       spins. Open all day here so the example runs; a real one is narrow.
#   catalogue           playground.generate, the day's manifest. A node stands in for the
#                       source read, so the whole document runs with nothing to reach.
#   check_catalogue     validate.schema, the first gate. Everything past it provably received
#                       the shape, because it reads the gate's output rather than the raw
#                       record.
#   submit              playground.generate, once per region: the export job, which takes
#                       `pace` before it answers. Under items: continue a region that refuses
#                       is recorded against its own item.
#   deposit             storage.write, once per region: the export lands in the run's own
#                       landing zone as an object, which is the thing a sensor can wait for.
#   await               storage.exists, once per deposited export: a sensor with a deadline,
#                       polled every second, parked as a row in between, and refusing an
#                       object that is under its floor.
#   shape               transform.jq, once per region, reading THAT region's submission and
#                       THAT region's landing -- the matching item, not the batch.
#   check_region        validate.schema, once per region: the gate applied per item, so a
#                       region whose shape moved is refused on its own rather than in the join.
#   write_region        storage.write, once per region, named for ${item} so two items never
#                       write the same key.
#   manifest            transform.jq, the join: no for_each at all, one attempt over the list
#                       of every file that was written.
#   totals              transform.jq, the other join: rows and datasets across the regions.
#   publish             playground.generate, the batch handed on, with a retry policy over it.
#   page                report.render, the markdown a person reads in the morning.
#   save                storage.write, the page beside the data it is about.
#   announce            log.write, where the page landed, on the run's own timeline.
#   sweep               log.write behind rule: all_done, so it runs whichever way the night went.
#
# EXPECT THIS RUN TO SUCCEED in a few seconds, with eight files written and a page saved.
#
# THE PACE KNOB IS FOR WATCHING IT. `pace` is how long each region's export takes before it
# answers, so a run started with one has eight items visibly in flight rather than a graph
# that is green before the screen has drawn it:
#
#   dg run --local examples/showcase/nightly-regional-load.yaml
#   dg run --local examples/showcase/nightly-regional-load.yaml -p pace=6s     # watchable
#   dg run --local examples/showcase/nightly-regional-load.yaml -p regions='["east","west"]'
#
# On an instance it is the same document, plus the clock it carries:
#
#   dg apply examples/showcase/nightly-regional-load.yaml
#   dg run nightly-regional-load --watch
#   dg schedule list nightly-regional-load

format: dirigent/v1
kind: pipeline
code: nightly-regional-load
name: The nightly regional load
description: |
  A night's load over eight regions: a maintenance window, a catalogue read gated on its
  shape, one export submitted, deposited and waited on per region, a per-region gate and
  write, the joins over them, and a page saved beside the data.

  The pipeline the rest of this shelf is cut down from: six steps share one grid, two are
  gates, and the tail is the part somebody reads in the morning.

tags: [showcase, playground, sensor, transform, validate, storage, report, fan-out, graph, schedule, references, starter]

requires:
  blocks:
    - time.window
    - playground.generate
    - storage.exists
    - validate.schema
    - transform.jq
    - storage.write
    - report.render
    - log.write

params:
  type: object
  properties:
    day:
      type: string
      format: date
      default: "2026-03-01"
      description: The day being loaded, which every region's export is asked for.
    release:
      type: string
      default: nightly
      description: Which catalogue release the day is read from.
    regions:
      type: array
      default: [east, west, north, south, central, coastal, highland, lakeside]
      minItems: 1
      maxItems: 16
      items:
        type: string
      description: One item, one export, one file, per element.
    pace:
      type: string
      default: 0s
      description: How long each region's export takes before it answers; a humane duration.

# Carried, so `dg run --local` has the shapes without an instance holding them. An instance
# refuses a document that carries a schema, so a copy of this names them in requires instead.
schemas:
  nightly-catalogue:
    type: object
    required: [day, release]
    additionalProperties: false
    properties:
      day: { type: string, format: date }
      release: { type: string, minLength: 1 }

  nightly-region:
    type: object
    required: [region, day, datasets]
    additionalProperties: false
    properties:
      region: { type: string, minLength: 1 }
      day: { type: string, format: date }
      export_ms: { type: integer, minimum: 0 }
      datasets:
        type: array
        minItems: 1
        items:
          type: object
          required: [dataset, rows]
          additionalProperties: false
          properties:
            dataset: { type: string }
            rows: { type: integer, minimum: 0 }

steps:
  maintenance_window:
    block: time.window
    # A sensor's clocks: poll is how often it is asked, deadline is how long it may be asked
    # for. A closed window parks until it opens rather than polling through the night.
    poll: 5s
    deadline: 2m
    config:
      # Open all day so the example runs without waiting. A real nightly window is the four
      # hours the warehouse is quiet: after "01:00", before "04:00".
      after: "00:00"
      before: "23:59"
      # Always state it. The default is UTC, and a window meant as local time silently becomes
      # the wrong hours wherever the worker happens to run.
      timezone: Europe/Oslo

  catalogue:
    block: playground.generate
    depends_on: [maintenance_window]
    config:
      # Stands in for the catalogue read. The node takes an input and hands it back as its
      # records, so the gate below has a shape to hold it to.
      input:
        day: "${params.day}"
        release: "${params.release}"

  check_catalogue:
    block: validate.schema
    depends_on: [catalogue]
    config:
      input: "${steps.catalogue.output.records.0}"
      schema: nightly-catalogue

  submit:
    block: playground.generate
    depends_on: [check_catalogue]
    for_each: "${params.regions}"
    # A region that refuses is recorded against its own item and the rest finish. Under the
    # default, fail_fast, one refusal would sink the whole night.
    items: continue
    retry:
      # 2s, then 4s, then give up, spread by jitter so eight items that failed in the same
      # instant do not retry in the same instant.
      max_attempts: 3
      backoff: 2s
      max_backoff: 30s
      multiplier: 2.0
      jitter: 0.2
    config:
      # The export takes this long before it answers, which is what makes the grid watchable.
      delay: "${params.pace}"
      input:
        region: "${item}"
        day: "${params.day}"
        datasets: [cases, climate]

  deposit:
    block: storage.write
    depends_on: [submit]
    # No grid of its own: it takes submit's, so deposit 3 writes submission 3.
    for_each: "${steps.submit.items}"
    config:
      # The landing zone, one object per region, named for the item so two items never write
      # the same key. write_region below is the curated output; this is the raw arrival.
      target: "${run.scratch}/exports/${item}.json"
      value: "${steps.submit.item.output.records.0}"
      content_type: application/json

  await:
    block: storage.exists
    depends_on: [deposit]
    for_each: "${steps.deposit.items}"
    poll: 1s
    deadline: 2m
    config:
      uri: "${run.scratch}/exports/${item}.json"
      # The floor a landing has to clear. A producer uploading a large object makes the key
      # visible before the bytes are all there, and without this the load reads a half file.
      min_size: 10b

  shape:
    block: transform.jq
    depends_on: [submit, await]
    # await took deposit's grid, which took submit's, so this reaches all three by position.
    for_each: "${steps.await.items}"
    config:
      input:
        # The matching item's output in every case, not the list of every item's.
        submitted: "${steps.submit.item.output.records.0}"
        export_ms: "${steps.submit.item.output.delay_ms}"
        landed_bytes: "${steps.await.item.output.size}"
      # The row counts are derived from the dataset name: what matters here is the shape one
      # region's record arrives in, and that the record came from that region's own item.
      program: |
        {region: .submitted.region,
         day: .submitted.day,
         export_ms: .export_ms,
         datasets: [.submitted.datasets[] | {dataset: ., rows: (length * 100)}]}

  check_region:
    block: validate.schema
    depends_on: [shape]
    for_each: "${steps.shape.items}"
    config:
      input: "${steps.shape.item.output.value}"
      schema: nightly-region

  write_region:
    block: storage.write
    depends_on: [check_region]
    for_each: "${steps.check_region.items}"
    config:
      # ${item} is still the region this grid began as, three adoptions down.
      target: "${run.scratch}/regions/${item}.json"
      value: "${steps.check_region.item.output.value}"
      content_type: application/json

  manifest:
    block: transform.jq
    depends_on: [write_region]
    # No for_each, so this is the join: one attempt, and the batch arrives as a list.
    config:
      input: "${steps.write_region.output}"
      program: |
        {files: length,
         bytes: ([.[].bytes_written] | add),
         uris: [.[].uri]}

  totals:
    block: transform.jq
    depends_on: [check_region]
    config:
      input: "${steps.check_region.output}"
      program: |
        {regions: length,
         rows: ([.[].value.datasets[].rows] | add),
         datasets: ([.[].value.datasets[].dataset] | unique),
         slowest_ms: ([.[].value.export_ms] | max)}

  publish:
    block: playground.generate
    depends_on: [manifest, totals]
    retry:
      max_attempts: 3
      backoff: 1s
      multiplier: 2.0
    config:
      input:
        day: "${params.day}"
        manifest: "${steps.manifest.output.value}"
        totals: "${steps.totals.output.value}"

  page:
    block: report.render
    depends_on: [publish]
    config:
      # What the template may read, and the only thing it may read.
      values:
        day: "${params.day}"
        totals: "${steps.totals.output.value}"
        manifest: "${steps.manifest.output.value}"
      content_type: text/markdown
      template: |
        # Nightly load for {{ day }}

        {{ totals.regions }} regions loaded, {{ totals.rows }} rows across {{ totals.datasets | length }} datasets.
        The slowest export took {{ totals.slowest_ms }}ms.

        {{ manifest.files }} files were written, {{ manifest.bytes }} bytes in all.

        | Dataset |
        | --- |
        {% for dataset in totals.datasets %}
        | {{ dataset }} |
        {% endfor %}

  save:
    block: storage.write
    depends_on: [page]
    config:
      target: "${run.scratch}/nightly-${params.day}.md"
      text: "${steps.page.output.text}"
      content_type: "${steps.page.output.content_type}"

  announce:
    block: log.write
    depends_on: [save]
    config:
      message: the nightly page is written
      value:
        uri: "${steps.save.output.uri}"
        bytes: "${steps.save.output.bytes_written}"

  sweep:
    block: log.write
    depends_on: [announce, await]
    # all_done runs the sweep once every region has settled, refusals included. The default
    # all_success would skip it precisely on the night there is something to say.
    rule: all_done
    config:
      message: the nightly load has settled for every region
      level: info

# An empty section renders the page the engine ships: the run's facts, a row per step, the
# items that failed, and the run's error. It is rendered in the transaction that settles the
# run, so a run nobody's step survived still has an account of itself.
report: {}

triggers:
  schedules:
    - code: nightly-03
      name: Nightly, Oslo time
      description: Fires after the upstream extract has settled for the day.
      cron: "0 3 * * *"
      timezone: Europe/Oslo
