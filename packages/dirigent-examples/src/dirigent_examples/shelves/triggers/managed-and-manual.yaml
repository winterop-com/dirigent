# What an apply materialises, and what it deliberately leaves alone.
#
# The triggers: section is the declaration, and only the declaration. Applying this creates
# the schedules if they are absent and brings them up to date if they are not; it never
# touches whether a schedule is paused or when it last fired. Those are facts about one
# instance, so they stay in it.
#
# A schedule the document declares is managed: the instance owns it on the document's
# behalf, and an apply that stops mentioning it removes it. A schedule somebody created by
# hand with dg schedule create is not managed, and an apply never touches it -- deleting
# someone's schedule as a side effect of an unrelated edit is the kind of surprise that
# makes people stop applying documents at all. Both kinds show up in dg schedule list, which
# says which is which.
#
# Try it against a running instance:
#
#   dg apply examples/triggers/managed-and-manual.yaml
#   dg schedule list managed-and-manual
#   dg schedule create managed-and-manual by-hand --cron '0 7 * * 1' -p day=2026-01-01
#   dg schedule list managed-and-manual          # the hand-made one is not managed
#   dg apply examples/triggers/managed-and-manual.yaml   # a no-op, and by-hand survives it
#
# The steps run jq and nothing else, so there is no allowlist entry to make first. Locally,
# with no server at all:
#
#   dg run --local examples/triggers/managed-and-manual.yaml -p day=2026-01-01

format: dirigent/v1
kind: pipeline
code: managed-and-manual
name: Managed beside manual
description: |
  Run a load on two schedules the document manages, beside any made by hand.

  An apply updates those two, and leaves untouched whether one is paused, when it last fired,
  and any schedule made by hand.

tags: [triggers, transform, schedule, starter]

concurrency: skip

requires:
  blocks:
    - transform.jq

params:
  type: object
  properties:
    day:
      type: string
      format: date
      description: The day being loaded, which each schedule pins.
      default: "2026-01-01"
    environment:
      type: string
      enum: [staging, production]
      default: staging

steps:
  load:
    block: transform.jq
    config:
      input:
        day: "${params.day}"
        environment: "${params.environment}"
      program: |
        {loaded: .day, environment: .environment}

  verify:
    block: transform.jq
    depends_on: [load]
    config:
      input: "${steps.load.output.value}"
      program: |
        {verified: .loaded, environment: .environment}
    retry:
      max_attempts: 3
      backoff: 10s

triggers:
  schedules:
    # Five in the morning, Oslo time, all year: the zone is on the schedule rather than on
    # the process, so this stays five in the morning across a daylight-saving boundary.
    - code: nightly
      cron: "0 5 * * *"
      timezone: Europe/Oslo
      params:
        day: "2026-01-01"
        environment: production

    # The same pipeline hitting staging on a rolling interval is a second schedule, not a
    # second pipeline.
    - code: staging-hourly
      interval: 1h
      timezone: UTC
      params:
        day: "2026-01-01"
        environment: staging
