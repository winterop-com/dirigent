[project]
name = "dirigent-mcp"
version = "0.28.0"
description = "An MCP server that lets an agent operate a dirigent instance through its API."
readme = "README.md"
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "dirigent-client==0.28.0",
    "dirigent-common==0.28.0",
    "mcp>=2.3.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
dirigent-mcp = "dirigent_mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
