[project]
name = "dirigent-parquet"
version = "0.10.1"
description = "The parquet format pack for dirigent: the convert.arrow codec, on pyarrow."
readme = "README.md"
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
dependencies = [
    "dirigent-common",
    "dirigent-plugin",
    "pyarrow>=21.0.0",
]

[project.entry-points."dirigent.plugins.v1"]
parquet = "dirigent_parquet:plugin"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
dirigent-plugin = { workspace = true }
dirigent-common = { workspace = true }
