<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <!--
          sokkel-ui's pre-paint script: writes the stored scheme and palette on <html> before the
          first paint, and the palette in its `data-theme` where nothing is stored yet. It has to
          stay a same-origin file, because the server's policy refuses inline script, and a classic
          script with neither async nor defer, so it runs before anything is drawn. `vite-ignore`
          leaves the tag as written, and the build drops the attribute.
        -->
        <script src="/appearance.js" data-theme="amber" vite-ignore></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>dirigent</title>
        <meta name="description" content="Build and operate pipelines on a dirigent instance." />
        <link rel="icon" type="image/png" href="/favicon-32.png" />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
