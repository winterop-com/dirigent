[project]
name = "dirigent-server"
version = "0.16.5"
description = "Dirigent FastAPI server: the REST API, its authentication, and the health probes."
readme = "README.md"
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "dirigent-client==0.16.5",
    "dirigent-common==0.16.5",
    "dirigent-core==0.16.5",
    "dirigent-examples==0.16.5",
    "fastapi>=0.141.1",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
dirigent-client = { workspace = true }
dirigent-core = { workspace = true }
dirigent-examples = { workspace = true }
