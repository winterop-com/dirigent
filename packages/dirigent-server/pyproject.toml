[project]
name = "dirigent-server"
version = "0.16.2"
description = "Dirigent FastAPI server: the REST API, its authentication, and the health probes."
readme = "README.md"
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "dirigent-client==0.16.2",
    "dirigent-common==0.16.2",
    "dirigent-core==0.16.2",
    "dirigent-examples==0.16.2",
    "fastapi>=0.141.1",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
dirigent-client = { workspace = true }
dirigent-core = { workspace = true }
dirigent-examples = { workspace = true }
